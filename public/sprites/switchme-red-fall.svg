<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <defs>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="headGrad-red" cx="60%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFA4A4" />
      <stop offset="40%" stop-color="#FF5C5C" />
      <stop offset="80%" stop-color="#FF3B3B" />
      <stop offset="100%" stop-color="#B31E24" />
    </radialGradient>
    <linearGradient id="bodyGrad-red" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="50%" stop-color="#FF3B3B" />
      <stop offset="100%" stop-color="#B31E24" />
    </linearGradient>
  </defs>
  <g transform="translate(50, 50)" filter="url(#glow-red)">
    <!-- Rear Limbs (Drawn Behind) -->
    <path d="M -9.5 19 C -14 26, -17 31, -15 35" stroke="#FF3B3B" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M -11 10 C -17 7, -21 3, -19 -1" stroke="#FF3B3B" stroke-width="6" stroke-linecap="round" fill="none" />
    
    <!-- 3/4 Torso with Forward Chest -->
    <g transform="translate(4, 12) rotate(10) scale(1, 1)">
      <path d="M -12 -12 L 2 -12 C 10 -12, 16 -7, 16 -1 C 16 6, 13 12, 8 15 L -4 15 C -11 15, -13.5 11, -13.5 4 C -13.5 -2, -13 -7, -12 -12 Z" fill="url(#bodyGrad-red)" stroke="rgba(255, 180, 180, 0.75)" stroke-width="1.5" />
      <ellipse cx="8" cy="-2" rx="7" ry="5.5" fill="rgba(255,255,255,0.28)" />
    </g>

    <!-- Forward Limbs (Drawn In Front) -->
    <path d="M 7.5 19 C 12 26, 17 32, 15 37" stroke="#FF5C5C" stroke-width="7.5" stroke-linecap="round" fill="none" />
    <path d="M 8 11 C 14 13, 18 18, 16 23" stroke="#FF5C5C" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Head & Visor (Sculpted 3/4 Forward Positioned) -->
    <g transform="translate(6, -10) rotate(7)">
      <path d="M -16 -15 C -5 -23, 10 -22, 17 -13 C 23 -4, 23 8, 16 16 C 10 22, -2 22, -10 16 C -22 8, -23 -5, -16 -15 Z" fill="url(#headGrad-red)" stroke="rgba(255, 180, 180, 0.75)" stroke-width="1.8" />
      <ellipse cx="7" cy="-5" rx="13" ry="9" fill="rgba(255,255,255,0.28)" />
      
      <!-- Glowing Vertical White Eyes with Forward Bias -->
      <g fill="#ffffff">
        <rect x="2.0" y="-7.2" width="4.4" height="11.5" rx="2.2" />
        <rect x="10.5" y="-8.2" width="5.6" height="13.5" rx="2.8" />
        <circle cx="14.8" cy="-4.2" r="1.3" />
      </g>
    </g>
  </g>
</svg>