<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <defs>
    <filter id="glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="headGrad-blue" cx="60%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#A3CEFF" />
      <stop offset="40%" stop-color="#579EFF" />
      <stop offset="80%" stop-color="#318BFF" />
      <stop offset="100%" stop-color="#0D52B8" />
    </radialGradient>
    <linearGradient id="bodyGrad-blue" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#579EFF" />
      <stop offset="50%" stop-color="#318BFF" />
      <stop offset="100%" stop-color="#0D52B8" />
    </linearGradient>
  </defs>
  <g transform="translate(50, 50) scale(-1, 1)" filter="url(#glow-blue)">
    <!-- Rear Limbs (Drawn Behind) -->
    <path d="M -9.5 16 C -16 19, -21 24, -18 28" stroke="#318BFF" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M -11 12 C -18 15, -23 18, -21 22" stroke="#318BFF" stroke-width="6" stroke-linecap="round" fill="none" />
    
    <!-- 3/4 Torso with Forward Chest -->
    <g transform="translate(4.5, 15) rotate(11) scale(1.3, 0.7)">
      <path d="M -12 -12 L 2 -12 C 10 -12, 16 -7, 16 -1 C 16 6, 13 12, 8 15 L -4 15 C -11 15, -13.5 11, -13.5 4 C -13.5 -2, -13 -7, -12 -12 Z" fill="url(#bodyGrad-blue)" stroke="rgba(180, 220, 255, 0.75)" stroke-width="1.5" />
      <ellipse cx="8" cy="-2" rx="7" ry="5.5" fill="rgba(255,255,255,0.28)" />
    </g>

    <!-- Forward Limbs (Drawn In Front) -->
    <path d="M 7.5 16 C 15 19, 21 23, 19 27" stroke="#579EFF" stroke-width="7.5" stroke-linecap="round" fill="none" />
    <path d="M 8 12 C 14 16, 20 20, 18 25" stroke="#579EFF" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Head & Visor (Sculpted 3/4 Forward Positioned) -->
    <g transform="translate(7, -4) rotate(7)">
      <path d="M -16 -15 C -5 -23, 10 -22, 17 -13 C 23 -4, 23 8, 16 16 C 10 22, -2 22, -10 16 C -22 8, -23 -5, -16 -15 Z" fill="url(#headGrad-blue)" stroke="rgba(180, 220, 255, 0.75)" stroke-width="1.8" />
      <ellipse cx="7" cy="-5" rx="13" ry="9" fill="rgba(255,255,255,0.28)" />
      
      <!-- Glowing Vertical White Eyes with Forward Bias -->
      <g fill="#ffffff">
        <rect x="2.0" y="-7.2" width="4.4" height="11.5" rx="2.2" />
        <rect x="10.5" y="-8.2" width="5.6" height="13.5" rx="2.8" />
        <circle cx="14.8" cy="-4.2" r="1.3" />
      </g>
    </g>
  </g>
</svg>